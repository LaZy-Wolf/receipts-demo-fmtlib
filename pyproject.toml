[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "receipts-demo-fmtlib"
version = "1.2.0"
description = "Tiny formatting helpers: byte sizes, percentages, ordinals, thousands separators."
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["fmtlib"]
